<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Royaume des Cendres</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080b0b;color:#e5dfcc;font-family:Georgia,serif;overflow:hidden}
#wrap{position:relative;width:100vw;height:100vh;background:#111}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#hud{position:absolute;inset:0;pointer-events:none;text-shadow:0 2px 5px #000}
.panel{background:linear-gradient(135deg,rgba(12,17,16,.92),rgba(25,25,21,.78));border:1px solid #71674b;box-shadow:0 0 20px #0008;padding:12px 15px}
#brand{position:absolute;top:16px;left:16px;font-size:22px;letter-spacing:3px;color:#d4c39a}#stats{position:absolute;top:58px;left:16px;width:210px}
.bar{height:9px;background:#271c1b;border:1px solid #59453b;margin:5px 0 9px}.fill{height:100%;width:100%;background:#9b3930;transition:width .15s}
#quest{position:absolute;top:16px;right:16px;width:255px;font-size:14px;line-height:1.5}#quest strong{color:#d9bf7e;letter-spacing:1px}
#hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#e0d7bf;font:13px Arial,sans-serif;background:#080b0bd9;padding:9px 14px;border:1px solid #504b3b}
#dialog{display:none;position:absolute;bottom:70px;left:50%;transform:translateX(-50%);width:min(600px,90vw);pointer-events:auto;line-height:1.5}
#dialog h3{margin:0 0 8px;color:#d8be7c}#dialog p{margin:0 0 10px}button{font:inherit;background:#302b20;color:#f1e5c4;border:1px solid #a18b58;padding:7px 12px;cursor:pointer}button:hover{background:#51432a}
#toast{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:20px;color:#e7d49e;opacity:0;transition:opacity .3s;text-align:center}
#mapname{position:absolute;bottom:60px;right:18px;font-size:12px;color:#b7b09b;letter-spacing:2px}
@media(max-width:600px){#quest{width:180px;font-size:12px}#brand{font-size:16px}#stats{width:155px}#hint{font-size:11px;white-space:normal;width:94%;text-align:center}}
</style>
</head>
<body><div id="wrap">
<canvas id="game"></canvas>
<div id="hud">
<div id="brand">LE ROYAUME DES CENDRES</div>
<div id="stats" class="panel"><div>VIE <span id="hpnum">100</span>/100</div><div class="bar"><div id="hp" class="fill"></div></div><div>ÉCLATS : <span id="souls">0</span></div><div style="font-size:12px;color:#aaa18b">Niveau 1 · L'Exilé</div></div>
<div id="quest" class="panel"><strong>JOURNAL DE QUÊTE</strong><hr style="border-color:#62573d"><div id="questtext">Parlez à la sentinelle près du feu.</div><p style="color:#a9a08c;font-size:12px">La brume dévore les terres du royaume...</p></div>
<div id="hint">ZQSD / WASD : se déplacer · ESPACE : attaquer · E : parler / examiner · MAJ : esquiver</div>
<div id="dialog" class="panel"><h3 id="dtitle">Sentinelle</h3><p id="dtext"></p><button id="dnext">Continuer [E]</button></div>
<div id="toast"></div><div id="mapname">LES TERRES OUBLIÉES</div>
</div></div>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*.72);canvas.height=Math.floor(H*.72);ctx.imageSmoothingEnabled=false;}resize();addEventListener('resize',resize);
const world={w:1800,h:1300};
const player={x:850,y:690,hp:100,maxhp:100,dir:0,attack:0,dodge:0,inv:0};
let souls=0,dialogOpen=false,quest=0,toastTimer=0;
const npcs=[{x:900,y:560,name:'Maëlys, la sentinelle',kind:'npc',said:false},{x:1160,y:810,name:'Marchand silencieux',kind:'merchant',said:false}];
const enemies=[
{x:660,y:480,type:'squelette',hp:45,max:45,speed:34,aggro:220,hit:0},
{x:1240,y:590,type:'squelette',hp:45,max:45,speed:30,aggro:220,hit:0},
{x:1320,y:970,type:'troll',hp:130,max:130,speed:20,aggro:280,hit:0},
{x:530,y:920,type:'squelette',hp:45,max:45,speed:33,aggro:210,hit:0}
];
const obstacles=[
{x:750,y:580,w:75,h:48,t:'ruin'},{x:1010,y:500,w:100,h:55,t:'ruin'},
{x:1090,y:680,w:55,h:80,t:'tree'},{x:690,y:800,w:65,h:85,t:'tree'},
{x:1450,y:690,w:80,h:90,t:'tree'},{x:410,y:650,w:80,h:90,t:'tree'},
{x:1020,y:1020,w:90,h:55,t:'ruin'},{x:860,y:380,w:55,h:70,t:'tree'},
{x:1360,y:420,w:70,h:90,t:'tree'},{x:570,y:610,w:50,h:55,t:'rock'}
];
const keys={};addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(k==='e')interact();if(k===' '&&!dialogOpen)attack();if(k==='shift')player.dodge=.25;});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function notify(t){let el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;toastTimer=2.2}
function updateQuest(){let q=['Parlez à Maëlys près du feu.','Éliminez les squelettes qui rôdent dans les ruines.','Retournez voir Maëlys.','La sentinelle vous a confié un nouvel objectif : explorez les terres maudites.'];document.getElementById('questtext').textContent=q[Math.min(quest,3)];}
function showDialog(title,text,callback){dialogOpen=true;document.getElementById('dialog').style.display='block';document.getElementById('dtitle').textContent=title;document.getElementById('dtext').textContent=text;document.getElementById('dnext').onclick=()=>{document.getElementById('dialog').style.display='none';dialogOpen=false;if(callback)callback();};}
function interact(){
 if(dialogOpen){document.getElementById('dnext').click();return}
 let near=npcs.find(n=>dist(player,n)<95);
 if(near){if(near.kind==='npc'){if(quest===0){showDialog(near.name,"Voyageur... la brume a réveillé les morts. Trois squelettes hantent ces ruines. Débarrassez-nous d'eux, et je vous révélerai ce qui est arrivé au roi.",()=>{quest=1;updateQuest();notify('Nouvelle quête : Les morts sans repos');});}else if(quest===1){showDialog(near.name,"Les morts sont toujours là. Suivez les sentiers, gardez votre lame prête.");}else if(quest===2){showDialog(near.name,"Vous avez fait ce que les soldats n'ont pas osé faire. Prenez ces éclats anciens. Au nord, un troll garde le chemin du sanctuaire.",()=>{souls+=25;quest=3;document.getElementById('souls').textContent=souls;updateQuest();notify('25 éclats anciens obtenus');});}else showDialog(near.name,"Le sanctuaire au nord cache la vérité sur la chute du royaume.");}
 else showDialog(near.name,"Je n'ai presque plus rien à vendre. Les routes sont devenues trop dangereuses.");return;}
 let e=enemies.find(e=>e.hp>0&&dist(player,e)<90);
 if(e){notify(e.type==='troll'?'Un troll massif vous barre la route.':'Un squelette couvert de poussière.');return}
}
function attack(){if(player.attack>0)return;player.attack=.28;let hits=enemies.filter(e=>e.hp>0&&dist(player,e)<95);for(const e of hits){e.hp-=e.type==='troll'?22:30;e.hit=.18;if(e.hp<=0){souls+=e.type==='troll'?15:5;document.getElementById('souls').textContent=souls;notify(e.type==='troll'?'Le troll s’effondre.':'Le squelette se brise en poussière.');}}
if(quest===1&&enemies.filter(e=>e.type==='squelette'&&e.hp>0).length===0){quest=2;updateQuest();notify('Objectif accompli : retournez voir Maëlys.');}}
function moveEntity(e,dx,dy){e.x=Math.max(30,Math.min(world.w-30,e.x+dx));e.y=Math.max(30,Math.min(world.h-30,e.y+dy));}
function update(dt){
 if(!dialogOpen){
 let dx=0,dy=0;if(keys['w']||keys['z']||keys['arrowup'])dy--;if(keys['s']||keys['arrowdown'])dy++;if(keys['a']||keys['q']||keys['arrowleft'])dx--;if(keys['d']||keys['arrowright'])dx++;
 if(dx||dy){let l=Math.hypot(dx,dy);dx/=l;dy/=l;player.dir=Math.atan2(dy,dx);let speed=player.dodge>0?390:175;moveEntity(player,dx*speed*dt,dy*speed*dt);}
 }
 player.attack=Math.max(0,player.attack-dt);player.dodge=Math.max(0,player.dodge-dt);player.inv=Math.max(0,player.inv-dt);
 enemies.forEach(e=>{if(e.hp<=0)return;e.hit=Math.max(0,e.hit-dt);let d=dist(player,e);if(d<e.aggro&&d>42&&!dialogOpen){let dx=(player.x-e.x)/d,dy=(player.y-e.y)/d;moveEntity(e,dx*e.speed*dt,dy*e.speed*dt);}if(d<47&&e.hit<=0&&player.inv<=0){player.hp=Math.max(0,player.hp-(e.type==='troll'?15:8));player.inv=.8;e.hit=.7;document.getElementById('hpnum').textContent=player.hp;document.getElementById('hp').style.width=player.hp+'%';if(player.hp===0){showDialog('Vous êtes tombé dans les ténèbres','La brume vous a englouti. Recommencer ?',()=>{player.hp=100;player.x=850;player.y=690;enemies.forEach(e=>e.hp=e.max);document.getElementById('hpnum').textContent=100;document.getElementById('hp').style.width='100%';});}}});
 }
 if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)document.getElementById('toast').style.opacity=0}
}
function polygon(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke();}}
function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
function drawTree(x,y,s=1){ellipse(x,y+10*s,25*s,9*s,'#080d0b99');polygon([[x-7*s,y],[x-4*s,y-38*s],[x+5*s,y-40*s],[x+8*s,y]],'#342c25');for(let i=0;i<3;i++){let yy=y-24*s-i*16*s;polygon([[x,yy-25*s],[x-24*s,yy+8*s],[x+25*s,yy+8*s]],i===1?'#26352d':'#1a2823','#394335');}}
function drawRuin(x,y,w,h){ctx.fillStyle='#393a32';ctx.fillRect(x-w/2,y-h,w,h);ctx.fillStyle='#252a25';ctx.fillRect(x-w/2+7,y-h+8,w-14,h-8);for(let i=1;i<4;i++){ctx.fillStyle='#555346';ctx.fillRect(x-w/2,y-h+i*12,w,2)}}
function drawCharacter(x,y,type,scale=1,dir=0){
 ellipse(x,y+12*scale,14*scale,6*scale,'#05080799');
 if(type==='player'){
 ctx.save();ctx.translate(x,y);ctx.rotate(dir*.08);
 polygon([[-10*scale,3*scale],[0,-15*scale],[10*scale,3*scale],[7*scale,12*scale],[-7*scale,12*scale]],'#383e3d','#858477');
 polygon([[-9*scale,-5*scale],[0,-23*scale],[9*scale,-5*scale]],'#202624');
 ellipse(0,-19*scale,6*scale,7*scale,'#aaa99a');polygon([[-5*scale,-22*scale],[0,-30*scale],[5*scale,-22*scale]],'#74786d');
 ctx.strokeStyle='#b8b9a4';ctx.lineWidth=3*scale;ctx.beginPath();ctx.moveTo(9*scale,-4*scale);ctx.lineTo(19*scale,-22*scale);ctx.stroke();
 if(player.attack>0){ctx.strokeStyle='#e0d6a0';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-3*scale,36*scale,-1.4,1.1);ctx.stroke();}
 ctx.restore();
 }else if(type==='squelette'){
 ellipse(x,y-8*scale,9*scale,12*scale,'#aaa995');ellipse(x-3*scale,y-9*scale,2*scale,3*scale,'#282b25');ellipse(x+3*scale,y-9*scale,2*scale,3*scale,'#282b25');
 polygon([[x-9*scale,y],[x+9*scale,y],[x+7*scale,y+15*scale],[x-7*scale,y+15*scale]],'#6d7064');ctx.strokeStyle='#b0ad98';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+8,y);ctx.lineTo(x+15,y-14);ctx.stroke();
 }else{polygon([[x-17,y+9],[x-14,y-15],[x-7,y-28],[x+9,y-26],[x+19,y-7],[x+16,y+12]],'#4a5541','#73775a');ellipse(x+1,y-22,10,8,'#626952');ellipse(x-3,y-23,2,2,'#c39a51');ellipse(x+5,y-23,2,2,'#c39a51');}
 if(type!=='player'&&type!=='npc'){ctx.fillStyle='#171514';ctx.fillRect(x-16,y-38,32,4);ctx.fillStyle='#9d4135';ctx.fillRect(x-16,y-38,32*Math.max(0, type==='troll'?enemies.find(e=>e.type===type&&Math.abs(e.x-x)<2)?.hp/130||0:1),4);}
}
function render(){
 let scaleX=canvas.width/W,scaleY=canvas.height/H;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);
 let camX=Math.max(0,Math.min(world.w-W,player.x-W/2)),camY=Math.max(0,Math.min(world.h-H,player.y-H/2));
 ctx.scale(scaleX,scaleY);ctx.save();ctx.translate(-camX,-camY);
 ctx.fillStyle='#202b25';ctx.fillRect(camX,camY,W,H);
 // moody ground tiles
 for(let y=Math.floor(camY/48)*48;y<camY+H+48;y+=48)for(let x=Math.floor(camX/48)*48;x<camX+W+48;x+=48){ctx.fillStyle=((Math.floor(x/48)+Math.floor(y/48))%2)?'#26312a':'#29332b';ctx.fillRect(x,y,47,47);if((x*7+y*3)%11===0){ctx.fillStyle='#34382d';ctx.fillRect(x+13,y+24,4,2)}}
 // cracked path
 ctx.strokeStyle='#45453a';ctx.lineWidth=72;ctx.beginPath();ctx.moveTo(830,1300);ctx.bezierCurveTo(780,1050,1000,930,900,750);ctx.bezierCurveTo(800,600,950,460,900,300);ctx.stroke();
 ctx.strokeStyle='#555044';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(830,1300);ctx.bezierCurveTo(780,1050,1000,930,900,750);ctx.bezierCurveTo(800,600,950,460,900,300);ctx.stroke();
 obstacles.forEach(o=>{if(o.t==='tree')drawTree(o.x,o.y,1.15);else drawRuin(o.x,o.y,o.w,o.h)});
 // ruined campfire
 ellipse(900,575,24,10,'#151714');ellipse(900,570,10,7,'#9e4e2b');ellipse(900,567,5,8,'#d69a4d');for(let i=0;i<6;i++){let a=i*Math.PI/3;ctx.strokeStyle='#4b3d2d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(900+Math.cos(a)*8,575+Math.sin(a)*5);ctx.lineTo(900+Math.cos(a+1)*17,575+Math.sin(a+1)*7);ctx.stroke();}
 // entities sorted by y
 let entities=[...npcs.filter(n=>n.x>camX-100&&n.x<camX+W+100).map(n=>({...n,renderType:'npc'})),...enemies.filter(e=>e.hp>0).map(e=>({...e,renderType:e.type})),{...player,renderType:'player'}].sort((a,b)=>a.y-b.y);
 entities.forEach(e=>{if(e.renderType==='npc'){drawCharacter(e.x,e.y,'player',.9);ctx.fillStyle='#d8c99e';ctx.font='13px Georgia';ctx.textAlign='center';ctx.fillText(e.name.split(',')[0],e.x,e.y-43);}else drawCharacter(e.x,e.y,e.renderType,e.renderType==='troll'?1.5:1,player.dir);});
 // ambient ground fog
 ctx.globalAlpha=.13;for(let i=0;i<7;i++){let fx=camX+(i*257+performance.now()*.008)%(W+180)-80;let fy=camY+(i*139+Math.sin(performance.now()*.0004+i)*35)%(H+100);ellipse(fx,fy,100,26,'#aab3a0')}ctx.globalAlpha=1;
 ctx.restore();
 // darkness vignette and softened edges
 let grad=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.18,W/2,H/2,Math.max(W,H)*.7);grad.addColorStop(0,'#05070600');grad.addColorStop(1,'#050706d9');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
 if(player.inv>0){ctx.fillStyle='#a23b3022';ctx.fillRect(0,0,W,H)}
 // tiny film grain
 for(let i=0;i<70;i++){let x=(i*137+performance.now()*.03)%W,y=(i*79)%H;ctx.fillStyle='#e4dec0';ctx.globalAlpha=.045;ctx.fillRect(x,y,1,1)}ctx.globalAlpha=1;
}
let last=performance.now();function loop(now){let dt=Math.min(.035,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(loop)}updateQuest();requestAnimationFrame(loop);
})();
</script></body></html>
